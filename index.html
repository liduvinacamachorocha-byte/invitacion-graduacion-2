<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invitación de Graduación</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #0c0c0c;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        .canva-container {
            position: relative;
            width: 100%;
            max-width: 450px;
            height: 100vh;
        }
        .canva-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <!-- Música de fondo oculta que se reproduce sola al entrar -->
    <audio id="musicaFondo" src="musica.mp3" loop autoplay></audio>

    <!-- Tu diseño interactivo de Canva (con el sobre, ubicación y botones) -->
    <div class="canva-container">
        <iframe src="https://www.canva.com/design/DAHXKCPx_6o/2cFukBTOyHMi6xzjJsfRSA/view?embed" allowfullscreen="allowfullscreen" allow="fullscreen"></iframe>
    </div>

    <script>
        // Truco para asegurar que la música suene al primer toque o carga
        document.addEventListener('click', function() {
            var audio = document.getElementById('musicaFondo');
            if (audio.paused) {
                audio.play();
            }
        }, { once: true });
    </script>
</body>
</html>
