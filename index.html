<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invitación de Graduación</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            color: #fff;
        }
        .container {
            max-width: 600px;
            width: 100%;
            text-align: center;
        }
        img {
            width: 100%;
            height: auto;
            display: block;
            margin: 0;
        }
        .audio-box {
            background-color: #2a2a2a;
            padding: 15px;
            margin: 0;
            border-bottom: 2px solid #444;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Reproductor de música de fondo -->
        <div class="audio-box">
            <p style="margin: 0 0 10px 0; font-size: 14px;">🎵 Reproduce la música de tu invitación:</p>
            <audio controls loop>
                <source src="musica.mp3" type="audio/mpeg">
                Tu navegador no soporta el elemento de audio.
            </audio>
        </div>

        <!-- Tus imágenes reales -->
        <img src="1.png" alt="Parte 1 de la invitación">
        <img src="2.png" alt="Parte 2 de la invitación">
    </div>

</body>
</html>
