<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invitación de Graduación - Fernanda Flores</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0c0c0c;
            font-family: 'Georgia', serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .invitation-container {
            width: 100%;
            max-width: 450px;
            background-color: #f7f5ef;
            min-height: 100vh;
            position: relative;
            box-shadow: 0 0 25px rgba(0,0,0,0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Reproductor de música arriba */
        .music-bar {
            width: 100%;
            background: #1a2a3a;
            color: #fff;
            padding: 8px;
            text-align: center;
            font-size: 13px;
            font-family: Arial, sans-serif;
            box-sizing: border-box;
            z-index: 1000;
        }

        audio {
            width: 80%;
            height: 28px;
            margin-top: 4px;
        }

        /* Pantalla de la portada con el sobre */
        #portada-screen {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: transform 0.8s ease-in-out, opacity 0.8s ease-in-out;
        }

        #portada-screen img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Botón animado */
        .open-btn {
            background-color: #c5a059;
            color: white;
            border: none;
            padding: 14px 35px;
            font-size: 16px;
            font-weight: bold;
            letter-spacing: 1.5px;
            border-radius: 30px;
            cursor: pointer;
            margin: 25px 0;
            box-shadow: 0 5px 15px rgba(197, 160, 89, 0.5);
            transition: transform 0.2s ease, background-color 0.2s ease;
        }

        .open-btn:active {
            transform: scale(0.95);
        }

        /* Contenido oculto que se desliza hacia arriba al abrir */
        #contenido-screen {
            display: none;
            width: 100%;
            flex-direction: column;
            align-items: center;
            opacity: 0;
            transform: translateY(50px);
            transition: opacity 1s ease, transform 1s ease;
        }

        #contenido-screen.mostrar {
            display: flex;
            opacity: 1;
            transform: translateY(0);
        }

        #contenido-screen img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Clase para animar la salida de la portada */
        .esconder-portada {
            transform: translateY(-100px);
            opacity: 0;
            position: absolute;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="invitation-container">
        
        <!-- Barra de música -->
        <div class="music-bar">
            <span>🎵 Dale play a la música de fondo:</span>
            <audio controls loop>
                <source src="musica.mp3" type="audio/mpeg">
                Tu navegador no soporta audio.
            </audio>
        </div>

        <!-- PORTADA CON EL SOBRE -->
        <div id="portada-screen">
            <img src="1.png" alt="Sobre de Invitación">
            <button class="open-btn" onclick="animarApertura()">ABRIR INVITACIÓN</button>
        </div>

        <!-- CONTENIDO INTERACTIVO DE LA INVITACIÓN -->
        <div id="contenido-screen">
            <img src="2.png" alt="Detalle Graduación">
            <img src="3.png" alt="Ubicación y Evento">
        </div>

    </div>

    <script>
        function animarApertura() {
            // Reproduce la música
            var audio = document.querySelector('audio');
            audio.play().catch(function(error) {
                console.log("Audio play bloqueado, requiere clic manual.");
            });

            // Aplica efecto de deslizamiento hacia arriba en la portada
            var portada = document.getElementById('portada-screen');
            portada.classList.add('esconder-portada');

            // Muestra con animación fluida el contenido completo tras una fracción de segundo
            setTimeout(function() {
                portada.style.display = 'none';
                var contenido = document.getElementById('contenido-screen');
                contenido.classList.add('mostrar');
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }, 500);
        }
    </script>

</body>
</html>
