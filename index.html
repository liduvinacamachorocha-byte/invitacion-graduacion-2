<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invitación de Graduación</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            font-family: Arial, sans-serif;
        }
        .container {
            max-width: 450px;
            width: 100%;
            text-align: center;
        }
        .audio-box {
            background-color: #1a1a1a;
            padding: 10px;
            width: 100%;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }
        .audio-box p {
            color: #fff;
            margin: 0 0 5px 0;
            font-size: 13px;
        }
        img {
            width: 100%;
            height: auto;
            display: block;
            margin: 0;
            padding: 0;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Reproductor de música fijo arriba -->
        <div class="audio-box">
            <p>🎵 Reproduce la música de tu invitación:</p>
            <audio controls loop>
                <source src="musica.mp3" type="audio/mpeg">
                Tu navegador no soporta el elemento de audio.
            </audio>
        </div>

        <!-- Tus imágenes en orden -->
        <img src="1.png" alt="Invitación Parte 1">
        <img src="2.png" alt="Invitación Parte 2">
    </div>

</body>
</html>
